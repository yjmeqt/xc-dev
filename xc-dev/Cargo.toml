[package]
name = "xc-dev"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Task runner for Xcode projects — package.json-style scripts with TOML-driven variables."
license = "MIT"

[[bin]]
name = "xc-dev"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
